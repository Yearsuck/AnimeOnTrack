[package]
name = "aot-scaffold"
version = "0.10.0"
description = "Tracks currently-airing anime across multiple streaming sites and tells you when new episodes drop."
authors = ["Yearsuck"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aot_scaffold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "~2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"
anyhow = "1"
url = "2"
# gzip for the catalog snapshot a new install downloads instead of crawling AniList.
flate2 = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "net", "io-util"] }
# AniList's public GraphQL API is a normal, non-Cloudflare-protected service
# (unlike the scraped site) — plain HTTP via reqwest is fine here, no need
# for the WebView2 scraping dance.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# Only used for current-year partition math (catalog sync) and the
# full_sync_completed_at timestamp — already pulled in transitively.
chrono = "0.4"
# Cloud backup (src-tauri/src/backup/): PKCE challenge hashing, base64url
# encode/decode for the verifier/challenge, and URL-encoding OAuth params.
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
# OS-backed CSPRNG for the OAuth PKCE verifier / state nonce (see
# backup/oauth.rs) — replaces a hand-rolled, clock-seeded PRNG that was not
# cryptographically secure.
getrandom = "0.3"
tauri-plugin-updater = "~2.10.1"
tauri-plugin-process = "~2.3.1"

# Windows-only: drive WebView2 ExecuteScript host-side to extract rendered HTML
# from external (Cloudflare-protected) pages without exposing app IPC to them.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }


# Our own code at opt-level 1: the matching/stats loops ran 5-10x slower than the
# release build at level 0, which made the dev app feel frozen at startup.
[profile.dev]
opt-level = 1

# Dependencies (bundled SQLite above all) run unoptimised in dev builds and make every
# query several times slower than in the release the owner installs; optimise them,
# keep our own crate at opt-level 0 for fast incremental builds.
[profile.dev.package."*"]
opt-level = 2
