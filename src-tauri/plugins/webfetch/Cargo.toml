[package]
name = "tauri-plugin-webfetch"
version = "0.1.0"
description = "Android-only: load a URL in an off-screen android.webkit.WebView and return the rendered HTML (AnimeOnTrack's scraper backend on Android)."
edition = "2021"
publish = false
links = "tauri-plugin-webfetch"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
