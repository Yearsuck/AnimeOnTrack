name: Release

# Fires when a version tag is pushed, e.g. `git tag v0.2.0 && git push --tags`.
# Builds installers for all three desktop OSes and publishes them to a single
# GitHub Release named after the tag.
#
# IMPORTANT: only the **Windows** build is functional. The scraper that detects
# new episodes uses Windows-only WebView2 interop; on macOS and Linux it is a
# stub (see docs/cross-platform-porting.md), so those builds compile and launch
# but cannot get past setup. They ship as clearly-labelled experimental
# artifacts until `eval()` is ported to WKWebView / WebKitGTK. No signing
# secrets are required (Google Drive creds are entered at runtime).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    strategy:
      # One OS failing must not cancel the others — we still want the Windows
      # installer published even if an experimental build breaks.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # Universal binary so both Apple Silicon and Intel Macs are covered.
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal build; other OSes just
          # use the host target.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            build-essential \
            file

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Each matrix job builds this OS's installers and uploads them to the same
      # release (keyed by the tag). tauri-action find-or-creates the release, so
      # the three jobs converge on one set of assets.
      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AnimeOnTrack ${{ github.ref_name }}"
          releaseBody: |
            ## Downloads

            - **Windows** (stable): `*_x64-setup.exe` (installer) or `*_x64_en-US.msi`.
            - **macOS** (⚠️ experimental): `*.dmg` — universal (Apple Silicon + Intel).
            - **Linux** (⚠️ experimental): `*.AppImage` or `*.deb`.

            > ⚠️ **macOS and Linux are experimental and not yet functional.** The
            > episode-detection scraper is Windows-only for now, so on macOS/Linux
            > the app builds and opens but cannot get past setup. They are published
            > for testing and build availability while the cross-platform port is in
            > progress (see `docs/cross-platform-porting.md`). Use **Windows** for a
            > working app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
