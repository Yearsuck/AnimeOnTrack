name: CI

# Validate every push and PR to the long-lived branches. Runs on Windows
# because the app is Windows-only (it drives WebView2) and `rusqlite`'s
# bundled feature compiles SQLite from C with the MSVC toolchain — the same
# environment the release build uses, so CI green means the release can build.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust (test + clippy)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Caches ~/.cargo and target/ keyed on Cargo.lock so a green run is a
      # couple of minutes rather than a full cold compile every time.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  frontend:
    name: Frontend (types + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
